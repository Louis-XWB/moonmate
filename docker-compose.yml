# Auto Trading Agent - Docker Compose
# 支持开发、测试、生产多环境部署

version: '3.8'

services:
  # ============================================
  # 后端 API 服务
  # ============================================
  backend:
    build:
      context: .
      dockerfile: Dockerfile
      target: backend
    container_name: trading-agent-backend
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    environment:
      - PYTHONPATH=/app
      - ENV=${ENV:-dev}
      - APIFY_API_TOKEN=${APIFY_API_TOKEN}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - EXCHANGE_API_KEY=${EXCHANGE_API_KEY}
      - EXCHANGE_API_SECRET=${EXCHANGE_API_SECRET}
    volumes:
      - ./config:/app/config:ro
      - ./logs:/app/logs
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - trading-network

  # ============================================
  # 前端服务（生产环境使用 Nginx）
  # ============================================
  frontend:
    image: nginx:alpine
    container_name: trading-agent-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    volumes:
      - ./frontend/dist:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
    networks:
      - trading-network

  # ============================================
  # Redis 缓存（可选）
  # ============================================
  redis:
    image: redis:7-alpine
    container_name: trading-agent-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes
    networks:
      - trading-network
    profiles:
      - full

  # ============================================
  # 监控服务 - Prometheus（可选）
  # ============================================
  prometheus:
    image: prom/prometheus:latest
    container_name: trading-agent-prometheus
    restart: unless-stopped
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    networks:
      - trading-network
    profiles:
      - monitoring

  # ============================================
  # 监控服务 - Grafana（可选）
  # ============================================
  grafana:
    image: grafana/grafana:latest
    container_name: trading-agent-grafana
    restart: unless-stopped
    ports:
      - "${GRAFANA_PORT:-3001}:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin}
    volumes:
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - trading-network
    profiles:
      - monitoring

# ============================================
# 网络配置
# ============================================
networks:
  trading-network:
    driver: bridge

# ============================================
# 数据卷
# ============================================
volumes:
  redis-data:
  prometheus-data:
  grafana-data:
