# Auto Trading Agent - 开发环境配置

env: dev
debug: true

# 交易模式
# - paper: 模拟盘（默认）
# - live_cex: 实盘CEX（币安永续）
# - live_dex: 实盘DEX（Hyperliquid链上）
trading:
  mode: paper
  symbols:
    - BTC/USDT
    - ETH/USDT
  base_currency: USDT
  max_position_size: 1000
  max_single_order: 100
  leverage: 1
  order_types:
    - limit
    - market
  min_order_interval: 60

# 币安永续合约配置
binance_futures:
  enabled: false
  api_key: ""
  api_secret: ""
  testnet: true
  leverage: 2
  margin_type: isolated  # isolated 或 crossed
  rate_limit: 10

# Hyperliquid链上永续配置
hyperliquid:
  enabled: false
  private_key: ""  # 0x开头的私钥
  testnet: true
  leverage: 2
  vault_address: ""  # 可选：通过Vault交易

# 风控配置
risk:
  max_daily_loss: 100
  max_daily_loss_pct: 5.0
  max_drawdown: 10.0
  stop_loss_pct: 2.0
  take_profit_pct: 5.0
  trailing_stop_pct: 1.0
  max_consecutive_losses: 5
  cooldown_period: 3600
  position_limit: 3

# AI配置
ai:
  enabled: true
  model: gpt-4.1-mini
  temperature: 0.3
  max_tokens: 1000
  confidence_threshold: 0.6
  signal_ttl: 300

# 策略配置
strategies:
  - name: momentum
    enabled: true
    params:
      rsi_period: 14
      rsi_overbought: 70
      rsi_oversold: 30
      sma_fast: 5
      sma_slow: 20
    weight: 1.0

# Apify数据抓取配置
apify:
  api_token: ""
  reddit:
    enabled: true
    subreddits:
      - Bitcoin
      - CryptoCurrency
      - ethereum
    max_items: 10
  twitter:
    enabled: false
    keywords:
      - bitcoin
      - crypto
      - btc
    max_items: 10

# API服务配置
api_host: "0.0.0.0"
api_port: 8000
ws_enabled: true

# 日志配置
logging:
  level: INFO
  file_enabled: true
  console_enabled: true
