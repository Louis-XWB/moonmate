# Auto Trading Agent - Development Environment Configuration

env: dev
debug: true

# Trading mode
# - paper: Paper trading (default)
# - live_cex: Live CEX (Binance perpetuals)
# - live_dex: Live DEX (Hyperliquid on-chain)
trading:
  mode: paper
  symbols:
    - BTC/USDT
    - ETH/USDT
  base_currency: USDT
  max_position_size: 1000
  max_single_order: 100
  leverage: 1
  order_types:
    - limit
    - market
  min_order_interval: 60

# Binance perpetual futures configuration
binance_futures:
  enabled: false
  api_key: ""
  api_secret: ""
  testnet: true
  leverage: 2
  margin_type: isolated  # isolated or crossed
  rate_limit: 10

# Hyperliquid on-chain perpetual configuration
hyperliquid:
  enabled: false
  private_key: ""  # Private key starting with 0x
  testnet: true
  leverage: 2
  vault_address: ""  # Optional: trade via Vault

# Risk control configuration
risk:
  max_daily_loss: 100
  max_daily_loss_pct: 5.0
  max_drawdown: 10.0
  stop_loss_pct: 2.0
  take_profit_pct: 5.0
  trailing_stop_pct: 1.0
  max_consecutive_losses: 5
  cooldown_period: 3600
  position_limit: 3

# AI configuration
ai:
  enabled: true
  model: gemini-3-flash-preview
  temperature: 0.3
  max_tokens: 1000
  confidence_threshold: 0.6
  signal_ttl: 300

# Strategy configuration
strategies:
  - name: momentum
    enabled: true
    params:
      rsi_period: 14
      rsi_overbought: 70
      rsi_oversold: 30
      sma_fast: 5
      sma_slow: 20
    weight: 1.0

# Apify data scraping configuration
apify:
  api_token: ""
  reddit:
    enabled: true
    subreddits:
      - Bitcoin
      - CryptoCurrency
      - ethereum
    max_items: 10
  twitter:
    enabled: false
    keywords:
      - bitcoin
      - crypto
      - btc
    max_items: 10

# API service configuration
api_host: "0.0.0.0"
api_port: 8000
ws_enabled: true

# Logging configuration
logging:
  level: INFO
  file_enabled: true
  console_enabled: true
